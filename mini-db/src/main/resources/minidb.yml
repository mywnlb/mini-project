# ============================================================
# mini-db 服务器配置
# ============================================================

server:
  # 监听端口（避开 MySQL 默认 3306）
  port: 3307
  # 默认用户名
  user: root
  # 密码（空字符串表示无密码）
  password: "123456"

storage:
  # 数据文件目录（相对路径基于工作目录）
  data-dir: data
  # 系统表空间名称（不含 .ibd 后缀）
  system-tablespace: system
  # Buffer Pool 大小（页数，每页 16KB）
  # 开发环境: 256~1024, 测试: 1024~4096, 生产: 10000+
  buffer-pool-pages: 1024

database:
  # 默认数据库名称
  default-name: default
